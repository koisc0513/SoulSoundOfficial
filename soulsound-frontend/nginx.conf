server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  # Cho phép upload file lớn (khớp với Spring Boot max-file-size=50MB)
  client_max_body_size 51m;

  # Static assets (JS, CSS, fonts, images) — serve trực tiếp, không fallback
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Images tĩnh
  location /images/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API proxy → Spring Boot
  location /api/ {
    proxy_pass         http://backend:8081;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # File uploads proxy → Spring Boot
  location /uploads/ {
    proxy_pass         http://backend:8081;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 60s;
  }

  # SPA routing — fallback về index.html cho mọi route React
  location / {
    try_files $uri $uri/ /index.html;
  }
}